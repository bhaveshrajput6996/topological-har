# Honest UCI window-duration ablation: crop each 2.56 s presegmented window
# to its last 1.5 s (shorter windows are measurable; longer ones are not --
# the dataset provides no longer raw streams, and the backend refuses loud).
project:
  name: uci-fusion-window-1.5s
  seed: 42

dataset:
  name: uci_har
  signal_mode: inertial
  subjects: null
  channels: null

window:
  default:
    duration_seconds: 1.5
    overlap: null
    max_windows: null
    label_strategy: mode

preprocessing:
  interpolation: linear
  max_interp_gap_s: 1.0
  filter:
    enabled: false
  normalization: standard

tda:
  enabled: true
  subsample:
    enabled: true
    max_points: 75
    method: stride
  homology_dimensions: [0, 1]
  persistence_image:
    resolution: [20, 20]
    bandwidth: 0.1
  statistical_features: true

model:
  type: tda_deepconvlstm

training:
  batch_size: 64
  epochs: 30
  patience: 6
  val_splits: 1
  seed: 42

evaluation:
  cv_folds: 5
  folds: null
