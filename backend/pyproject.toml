[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdl-har-backend"
version = "0.3.0"
description = "Topological Deep Learning Human Activity Recognition backend (TDA + DeepConvLSTM fusion)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "torch>=2.4",
  "gudhi>=3.10",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "httpx>=0.27",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
har-backend = "har.cli:main"

[tool.setuptools.packages.find]
include = ["har*", "app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
