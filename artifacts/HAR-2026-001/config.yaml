project:
  name: topological-har
  seed: 42
dataset:
  name: synthetic
  root: null
  signal_mode: null
  subjects: null
  channels: null
  activity_filter: null
  sampling_rate_override: null
window:
  default:
    duration_seconds: 2.0
    overlap: 0.5
    max_windows: null
    label_strategy: mode
preprocessing:
  interpolation: linear
  max_interp_gap_s: 1.0
  filter:
    enabled: false
    type: butterworth
    order: 2
    cutoff_hz: null
  normalization: standard
tda:
  enabled: true
  subsample:
    enabled: true
    max_points: 32
    method: stride
  metric: euclidean
  homology_dimensions:
  - 0
  - 1
  persistence_image:
    resolution:
    - 20
    - 20
    bandwidth: 0.1
    weight: persistence
    max_features: 0
  use_edge_collapse: true
  min_persistence: 0.0
  statistical_features: false
model:
  type: tda_deepconvlstm
  conv_channels:
  - 64
  - 128
  - 128
  - 256
  conv_kernel_size: 5
  lstm_hidden: 128
  dropout: 0.5
  head_hidden:
  - 256
  - 128
  apply_scaler_to_tda: true
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 2
  early_stopping: true
  patience: 8
  lr_scheduler: plateau
  scheduler_patience: 3
  scheduler_factor: 0.5
  weight_decay: 0.0
  seed: 42
  val_splits: 1
  num_workers: 0
evaluation:
  cv_folds: 2
  folds:
  - 0
  inference_batch: 64
  latency_runs: 0
  svm_c: 1.0
  svm_gamma: scale
  svm_max_train_windows: 20000
paths:
  data_dir: data
  artifacts_dir: artifacts
  db_path: artifacts/har_experiments.db
